<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Volt Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .profile-container { max-width: 1200px; margin: 100px auto 60px; padding: 0 20px; }
        .profile-header { background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); border-radius: 20px; padding: 40px; margin-bottom: 30px; display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
        .profile-avatar { width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .profile-info h2 { font-size: 28px; margin-bottom: 10px; }
        .profile-info p { opacity: 0.9; }
        .order-card { background: #0a0a0f; border-radius: 16px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .order-status { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-paid { background: #3b82f6; color: white; }
        .status-completed { background: #10b981; color: white; }
        .status-pending { background: #f59e0b; color: white; }
        .status-delivered { background: #8b5cf6; color: white; }
        .navbar { background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; border-bottom: 1px solid rgba(124,58,237,0.3); }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .nav-content { display: flex; align-items: center; justify-content: space-between; height: 70px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-menu { display: flex; gap: 32px; list-style: none; }
        .nav-menu a { color: #a1a1aa; text-decoration: none; }
        .user-menu { position: relative; }
        .user-dropdown { position: absolute; top: 50px; right: 0; width: 220px; background: #1e293b; border: 1px solid rgba(124,58,237,0.2); border-radius: 12px; padding: 8px; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 100; }
        .user-dropdown.show { opacity: 1; visibility: visible; }
        .dropdown-item { display: block; padding: 10px 15px; color: #a1a1aa; text-decoration: none; }
        .dropdown-item:hover { background: rgba(124,58,237,0.1); color: #7c3aed; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; text-decoration: none; }
        .loading { text-align: center; padding: 40px; color: #a1a1aa; }
        .error-message { text-align: center; padding: 40px; color: #ef4444; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo"><i class="fas fa-bolt"></i> VOLT</div>
                <ul class="nav-menu">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#products">Товары</a></li>
                    <li><a href="seller-info.html">Продавцам</a></li>
                    <li><a href="rules.html">Правила</a></li>
                </ul>
                <div class="nav-actions">
                    <div class="user-menu" id="userMenu">
                        <button class="user-btn" onclick="toggleUserDropdown()">
                            <i class="fas fa-user"></i>
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <div id="authButtons">
                                <a href="login.html" class="dropdown-item">Вход</a>
                                <a href="register.html" class="dropdown-item">Регистрация</a>
                            </div>
                            <div id="userInfo" style="display:none;">
                                <div class="dropdown-item" id="userName"></div>
                                <a href="profile.html" class="dropdown-item">Личный кабинет</a>
                                <a href="#" class="dropdown-item" onclick="logout()">Выйти</a>
                                <a href="seller-dashboard.html" class="dropdown-item" id="sellerLink" style="display:none;">Панель продавца</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div id="profileContent">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Загрузка профиля...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Глобальная функция для выхода
        window.logout = function() {
            window.auth.signOut().then(() => {
                sessionStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            });
        };
        
        window.toggleUserDropdown = function() {
            const dropdown = document.getElementById('userDropdown');
            if (dropdown) dropdown.classList.toggle('show');
        };
        
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('userDropdown');
            const userBtn = document.querySelector('.user-btn');
            if (dropdown && userBtn && !userBtn.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });
        
        // Основная функция загрузки профиля
        async function loadProfile() {
            const container = document.getElementById('profileContent');
            
            // Ждём Firebase
            if (!window.auth) {
                setTimeout(loadProfile, 500);
                return;
            }
            
            const user = window.auth.currentUser;
            
            if (!user) {
                container.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Вы не авторизованы</p>
                        <a href="login.html" class="btn" style="margin-top: 20px;">Войти в аккаунт</a>
                    </div>
                `;
                return;
            }
            
            try {
                // Получаем данные пользователя из Firestore
                const userDoc = await window.db.collection('users').doc(user.uid).get();
                const userData = userDoc.exists ? userDoc.data() : { name: user.email, email: user.email, role: 'buyer' };
                
                // Сохраняем в sessionStorage для других страниц
                sessionStorage.setItem('currentUser', JSON.stringify({
                    id: user.uid,
                    name: userData.name || user.email,
                    email: user.email,
                    role: userData.role || 'buyer'
                }));
                
                // Получаем заказы пользователя
                const ordersSnapshot = await window.db.collection('orders').where('buyerId', '==', user.uid).get();
                const orders = [];
                ordersSnapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
                
                // Отображаем профиль
                container.innerHTML = `
                    <div class="profile-header">
                        <div class="profile-avatar"><i class="fas fa-user"></i></div>
                        <div class="profile-info">
                            <h2>${escapeHtml(userData.name || user.email)}</h2>
                            <p>${user.email}</p>
                            <p><span style="background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px;">${userData.role === 'seller' ? 'Продавец' : 'Покупатель'}</span></p>
                            <p>Дата регистрации: ${new Date(user.metadata.creationTime).toLocaleDateString('ru-RU')}</p>
                        </div>
                    </div>
                    <div style="background: #111118; border-radius: 20px; padding: 30px;">
                        <h3 style="margin-bottom: 20px;">📦 Мои заказы (${orders.length})</h3>
                        <div id="ordersContainer">${renderOrders(orders)}</div>
                    </div>
                `;
                
                updateUserInterface();
                
            } catch (error) {
                console.error('Ошибка загрузки профиля:', error);
                container.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Ошибка загрузки профиля: ${error.message}</p>
                        <button onclick="location.reload()" class="btn" style="margin-top: 20px;">Обновить страницу</button>
                    </div>
                `;
            }
        }
        
        function renderOrders(orders) {
            if (orders.length === 0) {
                return '<div style="text-align:center; padding:40px; color:#a1a1aa;">У вас пока нет заказов</div>';
            }
            
            return orders.map(order => `
                <div class="order-card">
                    <div>
                        <strong>${escapeHtml(order.productName)}</strong><br>
                        Количество: ${order.quantity} шт.<br>
                        Сумма: ${order.total} ₽<br>
                        Дата: ${new Date(order.createdAt).toLocaleDateString('ru-RU')}
                    </div>
                    <div>
                        <span class="order-status status-${order.status}">${getStatusText(order.status)}</span>
                    </div>
                </div>
            `).join('');
        }
        
        function getStatusText(status) {
            const statuses = {
                'pending': '⏳ Ожидает оплаты',
                'paid': '✅ Оплачено',
                'delivered': '📦 Доставлено',
                'completed': '🎉 Завершен'
            };
            return statuses[status] || status;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Обновление интерфейса пользователя
        function updateUserInterface() {
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
            const authButtons = document.getElementById('authButtons');
            const userInfo = document.getElementById('userInfo');
            const userName = document.getElementById('userName');
            const sellerLink = document.getElementById('sellerLink');
            
            if (currentUser) {
                if (authButtons) authButtons.style.display = 'none';
                if (userInfo) userInfo.style.display = 'block';
                if (userName) userName.innerHTML = `<i class="fas fa-user"></i> ${escapeHtml(currentUser.name)}`;
                if (sellerLink && currentUser.role === 'seller') {
                    sellerLink.style.display = 'block';
                }
            } else {
                if (authButtons) authButtons.style.display = 'block';
                if (userInfo) userInfo.style.display = 'none';
            }
        }
        
        // Запускаем загрузку профиля после загрузки Firebase
        window.auth.onAuthStateChanged((user) => {
            if (user) {
                loadProfile();
            } else {
                document.getElementById('profileContent').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Вы не авторизованы</p>
                        <a href="login.html" class="btn" style="margin-top: 20px;">Войти в аккаунт</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Volt Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .profile-container { max-width: 1200px; margin: 100px auto 60px; padding: 0 20px; }
        .profile-header { background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); border-radius: 20px; padding: 40px; margin-bottom: 30px; display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
        .profile-avatar { width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .profile-info h2 { font-size: 28px; margin-bottom: 10px; }
        .profile-info p { opacity: 0.9; }
        .order-card { background: #0a0a0f; border-radius: 16px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .order-status { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-paid { background: #3b82f6; color: white; }
        .status-delivered { background: #8b5cf6; color: white; }
        .status-completed { background: #10b981; color: white; }
        .navbar { background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; border-bottom: 1px solid rgba(124,58,237,0.3); }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .nav-content { display: flex; align-items: center; justify-content: space-between; height: 70px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-menu { display: flex; gap: 32px; list-style: none; }
        .nav-menu a { color: #a1a1aa; text-decoration: none; }
        .user-btn { background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .user-btn:hover { transform: scale(1.05); }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo"><i class="fas fa-bolt"></i> VOLT</div>
                <ul class="nav-menu">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#products">Товары</a></li>
                    <li><a href="seller-info.html">Продавцам</a></li>
                    <li><a href="rules.html">Правила</a></li>
                </ul>
                <div class="nav-actions">
                    <button class="user-btn" onclick="goToProfile()">
                        <i class="fas fa-user"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar"><i class="fas fa-user"></i></div>
            <div class="profile-info">
                <h2 id="userNameDisplay">Загрузка...</h2>
                <p id="userEmailDisplay"></p>
                <p><span id="userRoleDisplay"></span></p>
                <p>ID пользователя: <span id="userIdDisplay"></span></p>
            </div>
        </div>
        <div style="background: #111118; border-radius: 20px; padding: 30px;">
            <h3 style="margin-bottom: 20px;">📦 Мои заказы</h3>
            <div id="ordersContainer"></div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="auth.js"></script>
    
    <script>
        function displayUserInfo() {
            const currentUser = window.getCurrentUser();
            
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('userNameDisplay').textContent = currentUser.name;
            document.getElementById('userEmailDisplay').textContent = currentUser.email;
            document.getElementById('userRoleDisplay').textContent = currentUser.role === 'seller' ? 'Продавец 👑' : 'Покупатель 🛍️';
            document.getElementById('userIdDisplay').textContent = currentUser.id;
            
            // Загружаем заказы пользователя
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            const userOrders = orders.filter(o => o.buyerId == currentUser.id);
            const container = document.getElementById('ordersContainer');
            
            if (userOrders.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#a1a1aa;">У вас пока нет заказов</div>';
                return;
            }
            
            container.innerHTML = userOrders.map(order => `
                <div class="order-card">
                    <div>
                        <strong>${order.productName}</strong><br>
                        Количество: ${order.quantity} шт.<br>
                        Сумма: ${order.total} ₽<br>
                        Дата: ${new Date(order.createdAt).toLocaleDateString('ru-RU')}
                    </div>
                    <div>
                        <span class="order-status status-${order.status}">${getStatusText(order.status)}</span>
                        ${order.status === 'delivered' ? `<button class="btn" style="margin-top:10px; padding:5px 15px;" onclick="confirmReceipt(${order.id})">✅ Подтвердить получение</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function confirmReceipt(orderId) {
            if (confirm('Подтвердить получение товара? Деньги будут переведены продавцу.')) {
                const orders = JSON.parse(localStorage.getItem('orders')) || [];
                const orderIndex = orders.findIndex(o => o.id == orderId);
                if (orderIndex !== -1) {
                    orders[orderIndex].status = 'completed';
                    localStorage.setItem('orders', JSON.stringify(orders));
                    alert('Спасибо за подтверждение!');
                    displayUserInfo();
                }
            }
        }
        
        function getStatusText(status) {
            const statuses = {
                'pending': '⏳ Ожидает оплаты',
                'paid': '✅ Оплачено (деньги на удержании)',
                'delivered': '📦 Товар отправлен, ожидает подтверждения',
                'completed': '🎉 Завершен'
            };
            return statuses[status] || status;
        }
        
        function goToProfile() {
            window.location.href = 'profile.html';
        }
        
        displayUserInfo();
        window.updateUserInterface();
    </script>
</body>
</html>

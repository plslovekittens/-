<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Volt Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .auth-card { background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
        .auth-card h2 { text-align: center; margin-bottom: 30px; color: white; }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px; }
        .btn-full { width: 100%; }
        .auth-link { text-align: center; margin-top: 20px; color: #94a3b8; }
        .auth-link a { color: #7c3aed; text-decoration: none; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .message.error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .message.success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .loading { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>🔐 Вход в аккаунт</h2>
            <div id="messageArea"></div>
            <form id="loginForm">
                <div class="form-group"><input type="email" id="loginEmail" placeholder="Email" required></div>
                <div class="form-group"><input type="password" id="loginPassword" placeholder="Пароль" required></div>
                <button type="submit" class="btn btn-primary btn-full" id="submitBtn" disabled>Войти</button>
            </form>
            <div class="auth-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    
    <script>
        let firebaseReady = false;
        
        function checkFirebaseReady() {
            if (window.auth) {
                firebaseReady = true;
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = 'Войти';
                console.log('✅ Firebase готов');
            } else {
                setTimeout(checkFirebaseReady, 500);
            }
        }
        
        function showMessage(message, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => { if (area.innerHTML.includes(message)) area.innerHTML = ''; }, 3000);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!firebaseReady || !window.auth) {
                showMessage('Подождите, Firebase загружается...', 'loading');
                return;
            }
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Вход...';
            
            const result = await window.loginUser(email, password);
            
            if (result.success) {
                showMessage('Вход выполнен! Перенаправление...', 'success');
                setTimeout(() => {
                    if (result.userData.role === 'seller') {
                        window.location.href = 'seller-dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1500);
            } else {
                showMessage('Ошибка: ' + result.error, 'error');
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        });
        
        checkFirebaseReady();
    </script>
</body>
</html>

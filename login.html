<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Volt Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px;">
        <div class="auth-card" style="background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px;">
            <h2 style="text-align: center; margin-bottom: 30px; color: white;">Вход в аккаунт</h2>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="email" id="loginEmail" placeholder="Email" required style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="password" id="loginPassword" placeholder="Пароль" required style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white;">
                </div>
                <button type="submit" class="btn btn-primary btn-full" style="width: 100%; padding: 12px; background: #7c3aed; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer;">Войти</button>
            </form>
            <div class="auth-link" style="text-align: center; margin-top: 20px; color: #94a3b8;">
                Нет аккаунта? <a href="register.html" style="color: #7c3aed; text-decoration: none;">Зарегистрироваться</a>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="auth.js"></script>
</body>
</html>

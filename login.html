<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Volt Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .login-card h2 { color: white; text-align: center; margin-bottom: 30px; font-size: 28px; }
        .form-group { margin-bottom: 20px; }
        .form-group input {
            width: 100%; padding: 14px; background: #0f172a;
            border: 1px solid #334155; border-radius: 10px;
            color: white; font-size: 16px;
        }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%);
            border: none; border-radius: 10px;
            color: white; font-size: 16px;
            font-weight: 600; cursor: pointer;
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .auth-link { text-align: center; margin-top: 20px; color: #94a3b8; }
        .auth-link a { color: #7c3aed; text-decoration: none; }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .message.error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .message.success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .message.info { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 Вход в аккаунт</h2>
        <div id="messageArea"></div>
        <form id="loginForm">
            <div class="form-group"><input type="email" id="loginEmail" placeholder="Email" required></div>
            <div class="form-group"><input type="password" id="loginPassword" placeholder="Пароль" required></div>
            <button type="submit" class="btn-login" id="submitBtn" disabled>Войти</button>
        </form>
        <div class="auth-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
    </div>

    <!-- Firebase SDK (COMPAT ВЕРСИИ) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    
    <script>
        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAeWBgPT84RzljctkdpGO1xtmhVd2MdD1w",
            authDomain: "diplom-57d78.firebaseapp.com",
            projectId: "diplom-57d78",
            storageBucket: "diplom-57d78.firebasestorage.app",
            messagingSenderId: "448908238147",
            appId: "1:448908238147:web:d222f715cf13a3c83d23f6"
        };
        
        let auth = null;
        let firebaseReady = false;
        
        function showMessage(message, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => { if (area.innerHTML.includes(message)) area.innerHTML = ''; }, 3000);
        }
        
        // Инициализация Firebase
        function initFirebase() {
            try {
                if (typeof firebase === 'undefined') {
                    console.error('Firebase SDK не загружен');
                    showMessage('Ошибка загрузки Firebase. Обновите страницу.', 'error');
                    return false;
                }
                
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                auth = firebase.auth();
                firebaseReady = true;
                console.log('✅ Firebase инициализирован');
                console.log('✅ auth:', !!auth);
                
                // Разблокируем кнопку
                document.getElementById('submitBtn').disabled = false;
                return true;
            } catch (error) {
                console.error('❌ Ошибка:', error);
                showMessage('Ошибка: ' + error.message, 'error');
                return false;
            }
        }
        
        // Обработчик формы входа
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!firebaseReady || !auth) {
                showMessage('Подождите, Firebase загружается...', 'info');
                return;
            }
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Вход...';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                console.log('✅ Вход выполнен:', user.uid);
                
                sessionStorage.setItem('currentUser', JSON.stringify({
                    id: user.uid,
                    email: user.email,
                    name: user.email.split('@')[0]
                }));
                
                showMessage('Вход выполнен! Перенаправление...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                
            } catch (error) {
                console.error('❌ Ошибка:', error.code, error.message);
                btn.disabled = false;
                btn.textContent = 'Войти';
                
                if (error.code === 'auth/user-not-found') {
                    showMessage('Пользователь не найден', 'error');
                } else if (error.code === 'auth/wrong-password') {
                    showMessage('Неверный пароль', 'error');
                } else if (error.code === 'auth/invalid-email') {
                    showMessage('Неверный формат email', 'error');
                } else if (error.code === 'auth/operation-not-allowed') {
                    showMessage('Email/Password не включен в Firebase Console', 'error');
                } else {
                    showMessage('Ошибка: ' + error.message, 'error');
                }
            }
        });
        
        // Запускаем инициализацию
        initFirebase();
    </script>
</body>
</html>

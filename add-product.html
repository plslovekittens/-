<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление товара - Volt Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 100px 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h2 { color: white; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #94a3b8; margin-bottom: 8px; }
        input, select, textarea {
            width: 100%; padding: 12px; background: #0f172a;
            border: 1px solid #334155; border-radius: 8px; color: white;
        }
        .btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%);
            border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer;
        }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>➕ Добавление товара</h2>
            <div id="messageArea"></div>
            <form id="addProductForm">
                <div class="form-group"><label>Название *</label><input type="text" id="name" required></div>
                <div class="form-group"><label>Категория *</label>
                    <select id="category" required>
                        <option value="games">Игры</option>
                        <option value="software">Программы</option>
                        <option value="subscriptions">Подписки</option>
                    </select>
                </div>
                <div class="form-group"><label>Цена *</label><input type="number" id="price" required></div>
                <div class="form-group"><label>Описание *</label><textarea id="description" rows="3" required></textarea></div>
                <div class="form-group"><label>Ключ активации *</label><input type="text" id="key" required></div>
                <div class="form-group"><label>Иконка</label>
                    <select id="image">
                        <option value="gamepad">Gamepad</option>
                        <option value="laptop-code">Laptop Code</option>
                        <option value="crown">Crown</option>
                    </select>
                </div>
                <button type="submit" class="btn">Добавить товар</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="auth.js"></script>
    
    <script>
        function showMessage(msg, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="${type}">${msg}</div>`;
            setTimeout(() => area.innerHTML = '', 3000);
        }
        
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = window.getCurrentUser();
            
            if (!user || user.role !== 'seller') {
                showMessage('Доступ только для продавцов', 'error');
                return;
            }
            
            const product = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: parseInt(document.getElementById('price').value),
                description: document.getElementById('description').value,
                key: document.getElementById('key').value,
                image: document.getElementById('image').value,
                sellerId: user.id,
                sellerName: user.name
            };
            
            const result = await window.DB.addProduct(product);
            if (result.success) {
                showMessage('Товар добавлен!', 'success');
                this.reset();
            } else {
                showMessage('Ошибка: ' + result.error, 'error');
            }
        });
    </script>
</body>
</html>

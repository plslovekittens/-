<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Volt Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; width: 400px; }
        h2 { color: white; text-align: center; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; }
        button { width: 100%; padding: 12px; background: #7c3aed; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .role { flex: 1; padding: 10px; text-align: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; cursor: pointer; color: white; }
        .role.selected { border-color: #7c3aed; background: #7c3aed20; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Регистрация</h2>
        <input type="text" id="name" placeholder="ФИО">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <input type="password" id="confirm" placeholder="Подтверждение пароля">
        <div class="role-selector">
            <div class="role" onclick="selectRole('buyer', this)">Покупатель</div>
            <div class="role" onclick="selectRole('seller', this)">Продавец</div>
        </div>
        <button onclick="register()">Зарегистрироваться</button>
        <p style="text-align: center; margin-top: 20px;"><a href="login.html" style="color: #7c3aed;">Уже есть аккаунт? Войти</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeWBgPT84RzljctkdpGO1xtmhVd2MdD1w",
            authDomain: "diplom-57d78.firebaseapp.com",
            projectId: "diplom-57d78",
            storageBucket: "diplom-57d78.firebasestorage.app",
            messagingSenderId: "448908238147",
            appId: "1:448908238147:web:d222f715cf13a3c83d23f6"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let selectedRole = 'buyer';
        
        function selectRole(role, element) {
            selectedRole = role;
            document.querySelectorAll('.role').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }
        
        async function register() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            
            if (password !== confirm) {
                alert('Пароли не совпадают');
                return;
            }
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    role: selectedRole,
                    createdAt: new Date().toISOString(),
                    balance: 0
                });
                
                alert('Регистрация успешна!');
                window.location.href = 'login.html';
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
    </script>
</body>
</html>

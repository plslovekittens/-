<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Volt Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .register-card {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .register-card h2 { color: white; text-align: center; margin-bottom: 30px; font-size: 28px; }
        .form-group { margin-bottom: 20px; }
        .form-group input {
            width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155;
            border-radius: 10px; color: white; font-size: 16px;
        }
        .role-selector { display: flex; gap: 15px; margin-bottom: 25px; }
        .role-option {
            flex: 1; padding: 12px; text-align: center; background: #0f172a;
            border: 1px solid #334155; border-radius: 10px; cursor: pointer;
            color: #94a3b8; transition: all 0.3s;
        }
        .role-option.selected { border-color: #7c3aed; background: #7c3aed20; color: white; }
        .btn-register {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%);
            border: none; border-radius: 10px; color: white; font-size: 16px;
            font-weight: 600; cursor: pointer;
        }
        .auth-link { text-align: center; margin-top: 20px; color: #94a3b8; }
        .auth-link a { color: #7c3aed; text-decoration: none; }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 14px; }
        .message.error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .message.success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="register-card">
        <h2>📝 Регистрация</h2>
        <div id="messageArea"></div>
        <form id="registerForm">
            <div class="form-group"><input type="text" id="regName" placeholder="ФИО" required></div>
            <div class="form-group"><input type="email" id="regEmail" placeholder="Email" required></div>
            <div class="form-group"><input type="password" id="regPassword" placeholder="Пароль (минимум 6 символов)" required></div>
            <div class="form-group"><input type="password" id="regPasswordConfirm" placeholder="Подтверждение пароля" required></div>
            <div class="role-selector">
                <div class="role-option" data-role="buyer" onclick="selectRole('buyer')"><i class="fas fa-user"></i> Покупатель</div>
                <div class="role-option" data-role="seller" onclick="selectRole('seller')"><i class="fas fa-store"></i> Продавец</div>
            </div>
            <input type="hidden" id="regRole" value="buyer">
            <button type="submit" class="btn-register">Зарегистрироваться</button>
        </form>
        <div class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="auth.js"></script>
    
    <script>
        function selectRole(role) {
            document.getElementById('regRole').value = role;
            document.querySelectorAll('.role-option').forEach(opt => {
                opt.classList.remove('selected');
                if (opt.getAttribute('data-role') === role) opt.classList.add('selected');
            });
        }
        
        function showMessage(message, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => { if (area.innerHTML.includes(message)) area.innerHTML = ''; }, 5000);
        }
        
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!window.auth) { showMessage('Ошибка: Firebase не загружен', 'error'); return; }
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            const role = document.getElementById('regRole').value;
            
            if (!name || !email || !password) { showMessage('Заполните все поля', 'error'); return; }
            if (password !== confirm) { showMessage('Пароли не совпадают', 'error'); return; }
            if (password.length < 6) { showMessage('Пароль минимум 6 символов', 'error'); return; }
            
            showMessage('Регистрация...', 'success');
            const result = await window.registerUser(name, email, password, role);
            
            if (result.success) {
                showMessage('Регистрация успешна! Перенаправление...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                showMessage('Ошибка: ' + result.error, 'error');
            }
        });
        
        document.querySelector('.role-option[data-role="buyer"]').classList.add('selected');
    </script>
</body>
</html>

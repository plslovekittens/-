<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Volt Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .auth-card { background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 500px; }
        .auth-card h2 { text-align: center; margin-bottom: 30px; color: white; }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px; }
        .role-selector { display: flex; gap: 20px; margin-bottom: 20px; }
        .role-option { flex: 1; padding: 12px; text-align: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; cursor: pointer; color: white; transition: 0.3s; }
        .role-option.selected { border-color: #7c3aed; background: #7c3aed20; }
        .btn-full { width: 100%; }
        .auth-link { text-align: center; margin-top: 20px; color: #94a3b8; }
        .auth-link a { color: #7c3aed; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="regName" placeholder="ФИО" required>
                </div>
                <div class="form-group">
                    <input type="email" id="regEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" placeholder="Пароль (минимум 6 символов)" required>
                </div>
                <div class="form-group">
                    <input type="password" id="regPasswordConfirm" placeholder="Подтверждение пароля" required>
                </div>
                <div class="role-selector">
                    <div class="role-option" data-role="buyer" onclick="selectRole('buyer')">
                        <i class="fas fa-user"></i> Покупатель
                    </div>
                    <div class="role-option" data-role="seller" onclick="selectRole('seller')">
                        <i class="fas fa-store"></i> Продавец
                    </div>
                </div>
                <input type="hidden" id="regRole" value="buyer">
                <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
            </form>
            <div class="auth-link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </div>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ СКРИПТЫ В ПРАВИЛЬНОМ ПОРЯДКЕ -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="auth.js"></script>
    
    <script>
        // Функция выбора роли
        function selectRole(role) {
            document.getElementById('regRole').value = role;
            document.querySelectorAll('.role-option').forEach(opt => {
                opt.classList.remove('selected');
                if (opt.getAttribute('data-role') === role) {
                    opt.classList.add('selected');
                }
            });
        }
        
        // Обработчик формы регистрации
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            
            // Проверка паролей
            if (password !== passwordConfirm) {
                alert('Пароли не совпадают');
                return;
            }
            
            // Проверка длины пароля
            if (password.length < 6) {
                alert('Пароль должен содержать минимум 6 символов');
                return;
            }
            
            // Проверка, что Firebase загружен
            if (!window.auth) {
                alert('Ошибка: Firebase не загружен. Проверьте подключение к интернету.');
                console.error('window.auth не определен');
                return;
            }
            
            console.log('Регистрация пользователя:', email);
            
            try {
                // Регистрация через Firebase Auth
                const userCredential = await window.auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Сохранение данных пользователя в Firestore
                await window.db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    role: role,
                    createdAt: new Date().toISOString(),
                    balance: 0,
                    isActive: true
                });
                
                console.log('Пользователь зарегистрирован:', user.uid);
                alert('Регистрация успешна! Теперь вы можете войти.');
                window.location.href = 'login.html';
                
            } catch (error) {
                console.error('Ошибка регистрации:', error);
                if (error.code === 'auth/email-already-in-use') {
                    alert('Этот email уже зарегистрирован');
                } else if (error.code === 'auth/weak-password') {
                    alert('Пароль слишком слабый. Используйте минимум 6 символов');
                } else {
                    alert('Ошибка: ' + error.message);
                }
            }
        });
    </script>
</body>
</html>

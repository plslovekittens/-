<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Volt Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .auth-card { background: #1e293b; border-radius: 16px; padding: 40px; width: 100%; max-width: 500px; }
        .auth-card h2 { text-align: center; margin-bottom: 30px; color: white; }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 16px; }
        .role-selector { display: flex; gap: 20px; margin-bottom: 20px; }
        .role-option { flex: 1; padding: 12px; text-align: center; background: #0f172a; border: 1px solid #334155; border-radius: 8px; cursor: pointer; color: white; transition: 0.3s; }
        .role-option.selected { border-color: #7c3aed; background: #7c3aed20; }
        .btn-full { width: 100%; }
        .auth-link { text-align: center; margin-top: 20px; color: #94a3b8; }
        .auth-link a { color: #7c3aed; text-decoration: none; }
        .message { padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .message.error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .message.success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .loading { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>📝 Регистрация</h2>
            <div id="messageArea"></div>
            <form id="registerForm">
                <div class="form-group"><input type="text" id="regName" placeholder="ФИО" required></div>
                <div class="form-group"><input type="email" id="regEmail" placeholder="Email" required></div>
                <div class="form-group"><input type="password" id="regPassword" placeholder="Пароль (минимум 6 символов)" required></div>
                <div class="form-group"><input type="password" id="regPasswordConfirm" placeholder="Подтверждение пароля" required></div>
                <div class="role-selector">
                    <div class="role-option" data-role="buyer" onclick="selectRole('buyer')"><i class="fas fa-user"></i> Покупатель</div>
                    <div class="role-option" data-role="seller" onclick="selectRole('seller')"><i class="fas fa-store"></i> Продавец</div>
                </div>
                <input type="hidden" id="regRole" value="buyer">
                <button type="submit" class="btn btn-primary btn-full" id="submitBtn" disabled>Зарегистрироваться</button>
            </form>
            <div class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="auth.js"></script>
    
    <script>
        let firebaseReady = false;
        
        // Проверка готовности Firebase
        function checkFirebaseReady() {
            if (window.auth && window.db) {
                firebaseReady = true;
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').textContent = 'Зарегистрироваться';
                showMessage('✅ Firebase готов!', 'success');
                console.log('✅ Firebase готов к работе');
            } else {
                setTimeout(checkFirebaseReady, 500);
            }
        }
        
        function showMessage(message, type) {
            const area = document.getElementById('messageArea');
            area.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => { if (area.innerHTML.includes(message)) area.innerHTML = ''; }, 4000);
        }
        
        function selectRole(role) {
            document.getElementById('regRole').value = role;
            document.querySelectorAll('.role-option').forEach(opt => {
                opt.classList.remove('selected');
                if (opt.getAttribute('data-role') === role) opt.classList.add('selected');
            });
        }
        
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!firebaseReady || !window.auth) {
                showMessage('Подождите, Firebase загружается...', 'loading');
                return;
            }
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            const role = document.getElementById('regRole').value;
            
            if (!name || !email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            if (password !== confirm) {
                showMessage('Пароли не совпадают', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Пароль должен содержать минимум 6 символов', 'error');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Регистрация...';
            
            const result = await window.registerUser(name, email, password, role);
            
            if (result.success) {
                showMessage('✅ Регистрация успешна! Перенаправление...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                showMessage('❌ Ошибка: ' + result.error, 'error');
                btn.disabled = false;
                btn.textContent = 'Зарегистрироваться';
            }
        });
        
        document.querySelector('.role-option[data-role="buyer"]').classList.add('selected');
        
        // Запускаем проверку Firebase
        checkFirebaseReady();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель продавца - Volt Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 0;
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .product-form {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
        }
        .products-table {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-top: 30px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            color: #7c3aed;
        }
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: #1e293b;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #7c3aed;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo"><i class="fas fa-bolt"></i> VOLT</div>
                <ul class="nav-menu">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#products">Товары</a></li>
                    <li><a href="seller-info.html">Продавцам</a></li>
                </ul>
                <div class="nav-actions">
                    <div class="user-menu">
                        <button class="user-btn" onclick="toggleUserDropdown()">
                            <i class="fas fa-user"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="dashboard-header">
        <div class="container">
            <h1>Панель продавца</h1>
            <p>Управляйте своими товарами и отслеживайте продажи</p>
        </div>
    </section>

    <section class="dashboard-content" style="padding: 60px 0;">
        <div class="container">
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <h3 id="totalProducts">0</h3>
                    <p>Товаров</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalSales">0</h3>
                    <p>Продаж</p>
                </div>
                <div class="stat-card">
                    <h3 id="totalEarnings">0 ₽</h3>
                    <p>Заработано</p>
                </div>
                <div class="stat-card">
                    <h3 id="pendingBalance">0 ₽</h3>
                    <p>Ожидает выплаты</p>
                </div>
            </div>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('add')">➕ Добавить товар</button>
                <button class="tab-btn" onclick="switchTab('list')">📦 Мои товары</button>
                <button class="tab-btn" onclick="switchTab('orders')">📋 Заказы</button>
            </div>

            <div id="addTab" class="tab-content active">
                <div class="product-form">
                    <h3>Добавить новый товар</h3>
                    <form id="addProductForm">
                        <div class="form-group">
                            <label>Название товара</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>Категория</label>
                            <select id="productCategory" required>
                                <option value="games">Игры</option>
                                <option value="software">Программы</option>
                                <option value="subscriptions">Подписки</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Цена (₽)</label>
                            <input type="number" id="productPrice" required>
                        </div>
                        <div class="form-group">
                            <label>Описание</label>
                            <textarea id="productDescription" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Цифровой ключ/файл (ссылка или ключ активации)</label>
                            <input type="text" id="productKey" placeholder="Ключ активации или ссылка на скачивание" required>
                        </div>
                        <div class="form-group">
                            <label>Изображение (выберите иконку)</label>
                            <select id="productImage">
                                <option value="gamepad">Gamepad</option>
                                <option value="laptop-code">Laptop Code</option>
                                <option value="crown">Crown</option>
                                <option value="shield-alt">Shield</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Добавить товар</button>
                    </form>
                </div>
            </div>

            <div id="listTab" class="tab-content">
                <div class="products-table">
                    <h3>Мои товары</h3>
                    <table id="sellerProductsTable">
                        <thead>
                            <tr><th>Название</th><th>Цена</th><th>Категория</th><th>Продано</th><th>Действия</th></tr>
                        </thead>
                        <tbody id="sellerProductsList"></tbody>
                    </table>
                </div>
            </div>

            <div id="ordersTab" class="tab-content">
                <div class="products-table">
                    <h3>Заказы</h3>
                    <table id="ordersTable">
                        <thead><tr><th>Товар</th><th>Покупатель</th><th>Сумма</th><th>Статус</th><th>Действие</th></tr></thead>
                        <tbody id="ordersList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/seller.js"></script>
</body>
</html>

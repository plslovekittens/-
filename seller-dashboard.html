<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель продавца - Volt Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-header { background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); padding: 100px 0 60px; color: white; text-align: center; }
        .dashboard-header h1 { font-size: 48px; margin-bottom: 20px; }
        .dashboard-content { padding: 60px 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #111118; border: 1px solid rgba(124,58,237,0.2); border-radius: 16px; padding: 25px; text-align: center; }
        .stat-card h3 { font-size: 36px; color: #7c3aed; margin-bottom: 10px; }
        .stat-card p { color: #a1a1aa; }
        .tab-buttons { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 24px; background: #111118; border: 1px solid rgba(124,58,237,0.2); border-radius: 12px; color: white; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); }
        .tab-content { display: none; background: #111118; border: 1px solid rgba(124,58,237,0.2); border-radius: 20px; padding: 30px; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #a1a1aa; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #0a0a0f; border: 1px solid rgba(124,58,237,0.3); border-radius: 8px; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: #7c3aed; }
        .delete-btn, .edit-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #ef4444; color: white; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }
        .navbar { background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; border-bottom: 1px solid rgba(124,58,237,0.3); }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
        .nav-content { display: flex; align-items: center; justify-content: space-between; height: 70px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-menu { display: flex; gap: 32px; list-style: none; }
        .nav-menu a { color: #a1a1aa; text-decoration: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <div class="logo"><i class="fas fa-bolt"></i> VOLT</div>
                <ul class="nav-menu">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="index.html#products">Товары</a></li>
                    <li><a href="seller-info.html">Продавцам</a></li>
                    <li><a href="rules.html">Правила</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="dashboard-header">
        <div class="container">
            <h1>Панель продавца</h1>
            <p>Управляйте своими товарами и отслеживайте продажи</p>
        </div>
    </section>

    <section class="dashboard-content">
        <div class="container">
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><h3 id="totalProducts">0</h3><p>Товаров</p></div>
                <div class="stat-card"><h3 id="totalSales">0</h3><p>Продаж</p></div>
                <div class="stat-card"><h3 id="totalEarnings">0 ₽</h3><p>Заработано</p></div>
                <div class="stat-card"><h3 id="pendingBalance">0 ₽</h3><p>Ожидает выплаты</p></div>
            </div>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('add')">➕ Добавить товар</button>
                <button class="tab-btn" onclick="switchTab('list')">📦 Мои товары</button>
                <button class="tab-btn" onclick="switchTab('orders')">📋 Заказы</button>
            </div>

            <div id="addTab" class="tab-content active">
                <h3 style="margin-bottom:20px;">Добавить новый товар</h3>
                <form id="addProductForm">
                    <div class="form-group"><label>Название товара</label><input type="text" id="productName" required></div>
                    <div class="form-group"><label>Категория</label><select id="productCategory" required><option value="games">Игры</option><option value="software">Программы</option><option value="subscriptions">Подписки</option></select></div>
                    <div class="form-group"><label>Цена (₽)</label><input type="number" id="productPrice" required></div>
                    <div class="form-group"><label>Описание</label><textarea id="productDescription" rows="3" required></textarea></div>
                    <div class="form-group"><label>Цифровой ключ</label><input type="text" id="productKey" placeholder="Ключ активации" required></div>
                    <div class="form-group"><label>Изображение</label><select id="productImage"><option value="gamepad">Gamepad</option><option value="laptop-code">Laptop Code</option><option value="crown">Crown</option><option value="shield-alt">Shield</option></select></div>
                    <button type="submit" class="btn">Добавить товар</button>
                </form>
            </div>

            <div id="listTab" class="tab-content">
                <h3 style="margin-bottom:20px;">Мои товары</h3>
                <div style="overflow-x:auto;"><table><thead><tr><th>Название</th><th>Цена</th><th>Категория</th><th>Продано</th><th>Действия</th></tr></thead><tbody id="sellerProductsList"></tbody></table></div>
            </div>

            <div id="ordersTab" class="tab-content">
                <h3 style="margin-bottom:20px;">Заказы</h3>
                <div style="overflow-x:auto;"><table><thead><tr><th>Товар</th><th>Покупатель</th><th>Сумма</th><th>Статус</th><th>Действие</th></tr></thead><tbody id="ordersList"></tbody></table></div>
            </div>
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-db.js"></script>
    <script src="auth.js"></script>
    <script>
        let sellerProducts = [];
        let sellerOrders = [];

        async function loadSellerData() {
            const currentUser = window.getCurrentUser();
            if (!currentUser || currentUser.role !== 'seller') {
                alert('Доступ запрещен');
                window.location.href = 'index.html';
                return;
            }
            
            const productsResult = await window.DB.getProductsBySeller(currentUser.id);
            if (productsResult.success) sellerProducts = productsResult.data;
            
            const ordersResult = await window.DB.getSellerOrders(currentUser.id);
            if (ordersResult.success) sellerOrders = ordersResult.data;
            
            updateStats();
            displayProducts();
            displayOrders();
        }
        
        function updateStats() {
            const totalEarned = sellerOrders.filter(o => o.status === 'completed').reduce((sum, o) => sum + o.total, 0);
            const pendingAmount = sellerOrders.filter(o => o.status === 'paid').reduce((sum, o) => sum + o.total, 0);
            
            document.getElementById('totalProducts').textContent = sellerProducts.length;
            document.getElementById('totalSales').textContent = sellerOrders.length;
            document.getElementById('totalEarnings').textContent = totalEarned.toLocaleString() + ' ₽';
            document.getElementById('pendingBalance').textContent = pendingAmount.toLocaleString() + ' ₽';
        }
        
        function displayProducts() {
            const tbody = document.getElementById('sellerProductsList');
            if (!tbody) return;
            
            if (sellerProducts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">У вас пока нет товаров</td></tr>';
                return;
            }
            
            tbody.innerHTML = sellerProducts.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.price} ₽</td>
                    <td>${p.category}</td>
                    <td>${p.soldCount || 0}</td>
                    <td>
                        <button class="edit-btn" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                        <button class="delete-btn" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }
        
        function displayOrders() {
            const tbody = document.getElementById('ordersList');
            if (!tbody) return;
            
            if (sellerOrders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Нет заказов</td></tr>';
                return;
            }
            
            tbody.innerHTML = sellerOrders.map(o => `
                <tr>
                    <td>${o.productName} x${o.quantity}</td>
                    <td>${o.buyerName}</td>
                    <td>${o.total} ₽</td>
                    <td>${getStatusText(o.status)}</td>
                    <td>${o.status === 'paid' ? `<button class="edit-btn" onclick="sendProductKey('${o.id}', '${o.productKey}')">Отправить ключ</button>` : ''}</td>
                </tr>
            `).join('');
        }
        
        async function sendProductKey(orderId, productKey) {
            if (confirm('Отправить ключ покупателю?')) {
                const result = await window.DB.updateOrderStatus(orderId, 'delivered');
                if (result.success) {
                    alert(`Ключ отправлен: ${productKey}`);
                    await loadSellerData();
                } else {
                    alert('Ошибка: ' + result.error);
                }
            }
        }
        
        async function deleteProduct(productId) {
            if (confirm('Удалить товар?')) {
                const result = await window.DB.deleteProduct(productId);
                if (result.success) {
                    alert('Товар удалён');
                    await loadSellerData();
                } else {
                    alert('Ошибка: ' + result.error);
                }
            }
        }
        
        async function editProduct(productId) {
            const product = sellerProducts.find(p => p.id == productId);
            if (!product) return;
            
            const newName = prompt('Новое название:', product.name);
            const newPrice = prompt('Новая цена:', product.price);
            
            if (newName && newPrice) {
                const result = await window.DB.updateProduct(productId, {
                    name: newName,
                    price: parseInt(newPrice)
                });
                if (result.success) {
                    alert('Товар обновлён');
                    await loadSellerData();
                } else {
                    alert('Ошибка: ' + result.error);
                }
            }
        }
        
        function getStatusText(status) {
            const statuses = {
                'pending': '⏳ Ожидает оплаты',
                'paid': '✅ Оплачено',
                'delivered': '📦 Ключ отправлен',
                'completed': '🎉 Завершён'
            };
            return statuses[status] || status;
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`${tab}Tab`).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        // Форма добавления товара
        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const currentUser = window.getCurrentUser();
            
            const newProduct = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseInt(document.getElementById('productPrice').value),
                description: document.getElementById('productDescription').value,
                key: document.getElementById('productKey').value,
                image: document.getElementById('productImage').value,
                sellerId: currentUser.id,
                sellerName: currentUser.name
            };
            
            const result = await window.DB.addProduct(newProduct);
            if (result.success) {
                alert('Товар добавлен!');
                this.reset();
                await loadSellerData();
            } else {
                alert('Ошибка: ' + result.error);
            }
        });
        
        window.switchTab = switchTab;
        window.sendProductKey = sendProductKey;
        window.deleteProduct = deleteProduct;
        window.editProduct = editProduct;
        
        loadSellerData();
    </script>
</body>
</html>
